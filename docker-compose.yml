version: "3.9"
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/ai_inventory
      - JWT_SECRET=devsecret
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongo
    ports:
      - "5000:5000"

  client:
    build: ./client
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:5000/api
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  mongo_data:
